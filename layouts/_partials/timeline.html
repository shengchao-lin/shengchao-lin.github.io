{{- /* Vertical timeline. Args (dict): items (org, role, dates, detail). */ -}}
<ol class="timeline">
  {{- range .items }}
  <li>
    <div class="timeline-head">
      <strong>{{ .org }}</strong>
      {{- with .dates }}<span class="timeline-dates">{{ . }}</span>{{ end }}
    </div>
    <p>{{ .role }}</p>
    {{- with .detail }}<p class="timeline-detail">{{ . | markdownify }}</p>{{ end }}
  </li>
  {{- end }}
</ol>
