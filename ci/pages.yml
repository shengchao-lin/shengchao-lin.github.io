name: Deploy static site

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  repository_dispatch:
    # Fired by AlphaBridge's CI after a merge to its main branch, so the
    # showcase and read-only subsite refresh as soon as the engine changes.
    types: [alphabridge-updated]
  schedule:
    # Weekly refresh so the AlphaBridge showcase tracks the latest UI and
    # evolution artifacts even without portfolio commits.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone AlphaBridge
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.ALPHABRIDGE_REPO_TOKEN }}@github.com/shengchao-lin/AlphaBridge.git _alphabridge_tmp

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh AlphaBridge showcase screenshots and demo video
        # Best-effort: screenshots the *current* UI served by the freshly
        # cloned engine into static/images/alphabridge before Hugo builds. If
        # anything fails, the committed screenshots are used instead, so a
        # flaky browser never blocks a deploy.
        continue-on-error: true
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          cd _alphabridge_tmp
          python3 main.py playground --no-browser --port 8765 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8765/play.html && break
            sleep 1
          done
          cd "$GITHUB_WORKSPACE"
          node scripts/capture-alphabridge-screenshots.mjs
          python3 scripts/compress_alphabridge_screenshots.py
          kill "$SERVER_PID"

      - name: Install Hugo
        run: |
          curl -sSL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      - name: Cache resized photos
        # Resizing the full-resolution gallery originals is the slow part of
        # the build; the cache makes repeat builds take seconds.
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ hashFiles('content/**/*.jpg', 'layouts/**', 'hugo.toml') }}
          restore-keys: hugo-resources-

      - name: Build site with Hugo
        run: hugo --gc --baseURL "https://shengchao-lin.github.io/"

      - name: Build AlphaBridge read-only static site
        # build_site.py snapshots the agreement/dashboard/evolution data into
        # public/AlphaBridge/data/, which both the read-only subsite and the
        # showcase page's live stats consume.
        run: |
          cd _alphabridge_tmp
          python3 -B scripts/build_site.py "$GITHUB_WORKSPACE/public/AlphaBridge"

      - name: Bake live champion stats into the showcase
        # content/alphabridge.html holds placeholder numbers; replace them in
        # the built page with values computed from the fresh evolution
        # artifact so every deploy ships current stats even for no-JS visitors.
        run: python3 -B scripts/bake_alphabridge_stats.py --data public/AlphaBridge/data/evolution_latest.json --page public/alphabridge.html

      - name: Check internal links
        # Fatal: never deploy a site with internal 404s (e.g. a subsite page
        # that exists in the engine repo but was not shipped by build_site.py).
        run: python3 -B scripts/check_internal_links.py public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
